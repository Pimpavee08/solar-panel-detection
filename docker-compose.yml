# Airflow + PostgreSQL สำหรับรัน pipeline ตรวจจับแผงโซลาร์เซลล์
#
#   docker compose up -d --build
#   เปิด http://localhost:8080  (airflow / airflow)
#
# Postgres ตัวเดียวถูกใช้ 2 หน้าที่ แยกกันคนละ database:
#   airflow  = metadata ของ Airflow เอง
#   solar    = ตาราง Task / Task_Step / Task_Result ของโปรเจกต์
#
# ฝั่งเว็บ (uvicorn บนเครื่อง) ต้องชี้มาที่ฐานข้อมูลเดียวกัน:
#   SOLAR_DATABASE_URL=postgresql+psycopg2://airflow:airflow@localhost:5432/solar
#   SOLAR_AIRFLOW_URL=http://localhost:8080

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # ให้ DAG import pipeline.py / models.py ของโปรเจกต์ได้
    PYTHONPATH: /opt/project
    # ฐานข้อมูลและโฟลเดอร์ข้อมูลของโปรเจกต์ ต้องตรงกับที่ฝั่งเว็บใช้
    SOLAR_DATABASE_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/solar
    SOLAR_DATA_DIR: /opt/project/data/inference
  volumes:
    # mount ทั้งโปรเจกต์ แก้โค้ดแล้ว Airflow เห็นทันทีโดยไม่ต้อง build ใหม่
    - .:/opt/project
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-solar-db.sh:/docker-entrypoint-initdb.d/init-solar-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Solar --lastname Team \
          --role Admin --email solar@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
  airflow-logs:
